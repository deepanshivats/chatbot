<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank ChatBot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f1f1; padding: 0; margin: 0; }
    .chatbox { width: 400px; margin: 50px auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    .bot, .user { margin: 10px 0; }
    .bot { color: #007bff; }
    .user { color: #333; text-align: right; }
    input[type="text"] { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <div class="chatbox">
    <h3>Bank ChatBot</h3>
    <div class="messages" id="chatlog"></div>
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function appendMessage(sender, text) {
      const chatlog = document.getElementById("chatlog");
      const msg = document.createElement("div");
      msg.className = sender;
      msg.innerText = text;
      chatlog.appendChild(msg);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";

      fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      })
      .then(res => res.json())
      .then(data => {
        appendMessage("bot", data.reply);
      });
    }
  </script>
</body>
</html>
